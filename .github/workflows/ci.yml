name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install Maven
        run: |
          curl -fsSL -o /tmp/maven.zip https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
          unzip -q /tmp/maven.zip -d "$HOME"
          echo "$HOME/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - name: Test and package
        run: mvn -B verify

  sast:
    name: SAST SpotBugs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install Maven
        run: |
          curl -fsSL -o /tmp/maven.zip https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
          unzip -q /tmp/maven.zip -d "$HOME"
          echo "$HOME/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - name: SpotBugs
        run: mvn -B spotbugs:check

  sca:
    name: SCA OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install Maven
        run: |
          curl -fsSL -o /tmp/maven.zip https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
          unzip -q /tmp/maven.zip -d "$HOME"
          echo "$HOME/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            mvn -B org.owasp:dependency-check-maven:check -DnvdApiKey="$NVD_API_KEY"
          else
            mvn -B org.owasp:dependency-check-maven:check
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
