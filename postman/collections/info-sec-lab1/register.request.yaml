$kind: http-request
method: POST
url: '{{base_url}}/auth/register'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "login": "{{reg_user}}",
      "pass": "{{reg_pass}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const suffix = Date.now();
      pm.collectionVariables.set("reg_user", "student" + suffix);
      pm.collectionVariables.set("reg_pass", "Reg" + suffix + "Aa1");
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("register returns 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("register returns a jwt", function () {
          const body = pm.response.json();
          pm.expect(body.token).to.be.a("string").and.not.empty;
      });
