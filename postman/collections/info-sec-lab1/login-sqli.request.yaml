$kind: http-request
method: POST
url: '{{base_url}}/auth/login'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "login": "' OR 1=1 --",
      "pass": "password"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("sql injection is rejected", function () {
          pm.response.to.have.status(401);
      });
