$kind: http-request
method: GET
url: '{{base_url}}/api/data'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("data with token returns 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("data is a list", function () {
          pm.expect(pm.response.json()).to.be.an("array");
      });
